<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Map with Fade & Notify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <!-- Roboto & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link  href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>

  <style>
    body, html { margin:0; padding:0; height:100%; font-family:'Roboto',sans-serif; }
    #map { position:absolute; top:0; bottom:0; width:100%; }
    #homeButton {
      position:absolute; top:10px; left:10px; z-index:2;
      padding:10px 20px; font-size:16px; font-weight:700;
      background:rgba(255,255,255,0.9); color:#005e95; border:none; border-radius:8px;
      cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.3); backdrop-filter:blur(4px);
    }
    .material-icons { font-size:24px; }
  </style>
</head>
<body>

  <button id="homeButton" title="Clear & Home">
    <span class="material-icons">home</span>
  </button>
  <div id="map"></div>

  <script>
    // 1) Token & config
    mapboxgl.accessToken = 'pk.eyJ1IjoiMjBhaG9lcyIsImEiOiJjbWFwazQxbDgwaXMzMmxwbzJmNmhidm0yIn0.NileAvzC_m2asZI3tLIqUw';

    const defaultCenter   = [-71.245,42.254];
    const defaultZoom     = 8;
    const bounds          = [[-72.5,41.5],[-69.5,43.0]];
    const vectorLayerId   = 'mbta-municipalities-by-compli-5gbi66';
    const tileField       = 'MBTA_Mun_4';
    const geojsonField    = 'MBTA_Municipalities_data0k5Yh_1';
    const geojsonURL      = './mbtacompliance.geojson';

    let municipalitiesData = [];

    // 2) Init map
    const map = new mapboxgl.Map({
      container:'map',
      style:'mapbox://styles/20ahoes/cmbtl7zn9002x01s9a2nk0izb',
      center:defaultCenter, zoom:defaultZoom,
      minZoom:defaultZoom, maxBounds:bounds
    });

    // 3) Helpers
    function getFeatureBounds(feature) {
      const coords = feature.geometry.type==='MultiPolygon'
        ? feature.geometry.coordinates.flat(2)
        : feature.geometry.coordinates[0];
      return coords.reduce((b,c)=>b.extend(c), new mapboxgl.LngLatBounds());
    }

    function selectFeature(f) {
      const name = f.properties[geojsonField];
      console.log('[map] selectFeature:', name);
      map.fitBounds(getFeatureBounds(f),{padding:40,duration:800});
      map.setFilter('fade-layer',['!=',['get',geojsonField],name]);
      map.setLayoutProperty('fade-layer','visibility','visible');
      map.getSource('highlight-town').setData({
        type:'FeatureCollection', features:[f]
      });
      window.parent.postMessage({type:'town-selected',properties:f.properties},'*');
    }

    function clearSelection() {
      console.log('[map] clearSelection');
      map.setLayoutProperty('fade-layer','visibility','none');
      map.getSource('highlight-town').setData({type:'FeatureCollection',features:[]});
      map.flyTo({center:defaultCenter,zoom:defaultZoom,essential:true});
      window.parent.postMessage({type:'clear-town'},'*');
    }

    // 4) Map load
    map.on('load', ()=>{
      // 4a) fetch GeoJSON
      fetch(geojsonURL)
        .then(r=>r.ok? r.json():Promise.reject(r.status))
        .then(js=> {
          municipalitiesData = js.features;
          console.log('[map] Loaded features:', municipalitiesData.length);
        })
        .catch(err=>console.error('[map] GeoJSON load failed:',err));

      // 4b) fade layer
      map.addSource('municipalities-full',{type:'geojson',data:geojsonURL});
      map.addLayer({
        id:'fade-layer', type:'fill', source:'municipalities-full',
        paint:{'fill-color':'#888','fill-opacity':0.5},
        layout:{visibility:'none'}
      });

      // 4c) highlight layers
      map.addSource('highlight-town',{type:'geojson',data:{type:'FeatureCollection',features:[] }});
      map.addLayer({id:'highlight-fill', type:'fill', source:'highlight-town',
        paint:{'fill-color':'#FFEB3B','fill-opacity':0.8}});
      map.addLayer({id:'highlight-line', type:'line', source:'highlight-town',
        paint:{'line-color':'#FF9800','line-width':2}});

      // 4d) vector-tile click
      map.on('click', vectorLayerId, e=>{
        console.log('[map] clicked vector props:', e.features[0].properties);
        if(!municipalitiesData.length) return;
        const name = e.features[0].properties[tileField];
        if(!name) return;
        console.log('[map] clicked name:', name);
        const match = municipalitiesData.find(f=>
          f.properties[geojsonField]?.toLowerCase()=== name.toLowerCase()
        );
        console.log('[map] match:', match);
        if(match) selectFeature(match);
      });

      // 4e) home
      document.getElementById('homeButton').onclick = clearSelection;
    });

    // 5) search-town & clear-town
    window.addEventListener('message', e=>{
      console.log('[map] message:', e.data);
      if(!municipalitiesData.length) return;
      if(e.data.type==='search-town'){
        const term = e.data.name.trim().toLowerCase();
        console.log('[map] search term:', term);
        const match = municipalitiesData.find(f=>
          f.properties[geojsonField]?.toLowerCase()=== term
        );
        console.log('[map] search match:', match);
        if(match) selectFeature(match);
      }
      else if(e.data.type==='clear-town'){
        clearSelection();
      }
    });
  </script>
</body>
</html>
