<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>MBTA Municipalities Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    /* …all your existing CSS… */
  </style>
</head>
<body>

  <!-- Intro Overlay -->
  <div id="introOverlay">
    <div id="introPopup">
      <p>Welcome! Search or click a town to explore the MBTA Communities.</p>
      <button id="startButton">Start</button>
    </div>
  </div>

  <div id="container">
    <!-- … your legend & info‐panel markup … -->

    <div id="main">
      <div class="search-panel">
        <div class="input-wrapper">
          <input type="text" id="townSearch" placeholder="Enter Town Name"/>
          <button id="clearInput" aria-label="Clear input">✕</button>
        </div>
        <button id="doSearch">Search</button>
      </div>
      <iframe id="mapFrame" src="map_with_buttons.html?cachebust=1" title="Map View"></iframe>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const intro     = document.getElementById('introOverlay');
      const startBtn  = document.getElementById('startButton');
      const container = document.getElementById('container');
      const mapFrame  = document.getElementById('mapFrame');
      const input     = document.getElementById('townSearch');
      const btnSearch = document.getElementById('doSearch');
      const btnClear  = document.getElementById('clearInput');
      const btnClose  = document.getElementById('closePanel'); // your X in the info panel

      startBtn.addEventListener('click', () => intro.style.display = 'none');

      function clearAll() {
        mapFrame.contentWindow.postMessage({ type:'clear-town' }, '*');
        container.classList.remove('info-open');
      }

      function runSearch() {
        const name = input.value.trim();
        if (!name) return;
        mapFrame.contentWindow.postMessage({ type:'search-town', name }, '*');
      }

      btnSearch .addEventListener('click', runSearch);
      input     .addEventListener('keydown', e => { if (e.key==='Enter') runSearch(); });
      btnClear  .addEventListener('click', () => { input.value=''; clearAll(); });

      // Listen for map → parent messages
      window.addEventListener('message', e => {
        const msg = e.data;
        if (msg?.type === 'town-selected') {
          const p = msg.properties;
          document.getElementById('townName') .textContent = p.MBTA_Municipalities_data0k5Yh_1  || 'N/A';
          document.getElementById('popField') .textContent = p.MBTA_Municipalities_MBTAStation   || 'N/A';
          document.getElementById('compField').textContent = p.Compliance_Status_Sheet_as_of_6  || 'N/A';
          document.getElementById('compactField').textContent = p.Compliance_Status_Sheet_as_of_7|| 'N/A';
          document.getElementById('compdeadField').textContent = p.Compliance_Status_Sheet_as_of_8|| 'N/A';
          container.classList.add('info-open');
        }
        else if (msg?.type === 'clear-town') {
          // parent ignores map’s clear-town echoes
